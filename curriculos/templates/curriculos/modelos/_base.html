{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ curriculo.nome }} — Currículo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/curriculo.css' %}" rel="stylesheet">
  {% block estilo %}{% endblock %}
</head>
<body class="modelo-{{ curriculo.modelo }}">
  <div class="barra no-print">
    <button class="btn btn-primary btn-sm" onclick="window.print()"><i class="bi bi-download"></i> Baixar PDF</button>
  </div>
  <article class="folha">
    {% block curriculo %}{% endblock %}
  </article>
</body>
</html>
