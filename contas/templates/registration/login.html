{% extends 'base.html' %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="row justify-content-center">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <h1 class="h3 mb-3">Entrar</h1>
    <form method="post">
      {% csrf_token %}
      {% if form.non_field_errors %}<div class="alert alert-danger">Usuário ou senha incorretos.</div>{% endif %}
      <div class="mb-3">
        <label class="form-label" for="id_username">Usuário</label>
        <input class="form-control" type="text" name="username" id="id_username" value="{{ form.username.value|default:'' }}" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="id_password">Senha</label>
        <input class="form-control" type="password" name="password" id="id_password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-100" type="submit">Entrar</button>
    </form>
    <p class="mt-3 text-center">Não tem conta? <a href="{% url 'cadastro' %}">Criar conta</a></p>
  </div>
</div>
{% endblock %}
